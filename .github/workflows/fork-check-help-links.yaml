name: Fork Check Help Links

# Fork-only (doesn't exist upstream): proves out check-help-links.yaml before it lands upstream.
# Checks out PR #2643's branch (which has the `test:manual` help-link check), reintroduces the
# broken link, and runs the split first-attempt / wait / retry steps. Confirms the test detects a
# broken link in CI, that the retry is visible as its own step, and that a long on-failure sleep
# survives without hitting the 6h job cap. Unlike prod it always retries (prod retries only on a
# schedule) so a manual dispatch exercises the sleep. See FORK.md.
on:
  workflow_dispatch:
    inputs:
      delay:
        description: 'Sleep between the two attempts (e.g. 5m, 1h)'
        default: '5m'
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-help-links:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: sillsdev/languageforge-lexbox
          ref: fix-complex-forms-help-link
      - name: reintroduce the broken help link
        run: sed -i 's#Complex_Forms_entry.htm#Complex_Forms.htm#' frontend/viewer/src/lib/views/entity-config.ts
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: 'frontend/package.json'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: './frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'
      - name: install
        working-directory: frontend
        run: pnpm install
      - name: check help links (first attempt)
        id: first
        continue-on-error: true
        working-directory: frontend/viewer
        run: pnpm run test:manual
      - name: wait ${{ inputs.delay }} before retry
        if: steps.first.outcome == 'failure'
        run: sleep ${{ inputs.delay }}
      - name: check help links (retry)
        if: steps.first.outcome == 'failure'
        working-directory: frontend/viewer
        run: pnpm run test:manual
