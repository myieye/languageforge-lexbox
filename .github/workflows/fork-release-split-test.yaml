name: fork-release-split-test
# Fork-only (see FORK.md): exercises .github/actions/release-notes and the draft-release step the
# way fw-lite.yaml and release-pipeline.yaml use them, without a build. Drafts only.
on:
  workflow_dispatch:
  push:
    branches: [tmp/release-split-notes-test]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: fw-lite
            tag: v2026-10-01-${{ github.sha }}
            prefixes: v20
            config: .github/release-fw-lite.yml
            make_latest: "false"
          - product: lexbox
            tag: lexbox-v2026-10-01-${{ github.sha }}
            prefixes: lexbox-v v20
            config: .github/release-lexbox.yml
            make_latest: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate release notes
        id: notes
        uses: ./.github/actions/release-notes
        with:
          tag: ${{ matrix.tag }}
          previous-tag-prefixes: ${{ matrix.prefixes }}
          config: ${{ matrix.config }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Show notes
        run: cat "${{ steps.notes.outputs.notes-file }}"
      - name: Create Release (draft)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ matrix.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.notes-file }}
          make_latest: ${{ matrix.make_latest }}
          draft: true
