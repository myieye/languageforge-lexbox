name: fork-docs-preview
# Fork-only (see FORK.md): deploys the docs site from any branch to this fork's
# GitHub Pages, so staging work is previewable at
# https://myieye.github.io/languageforge-lexbox/ before promotion.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build the docs from
        required: true
        default: claude/fw-lite-lexbox-docs-0e3415

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    env:
      DOCS_URL: https://myieye.github.io
      DOCS_BASE_URL: /languageforge-lexbox/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: 'docs/package.json'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './docs/package.json'
          cache: 'pnpm'
          cache-dependency-path: './docs/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
